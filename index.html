<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Pulse</title>
    <meta
      name="description"
      content="A full-stack social network demo: posts, likes and real-time 1:1 chat. React, Vite, NestJS, Postgres and Socket.IO."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pulse" />
    <meta
      property="og:description"
      content="A full-stack social network demo: posts, likes and real-time 1:1 chat. React, Vite, NestJS, Postgres and Socket.IO."
    />
    <meta property="og:url" content="https://pulse-social-henna.vercel.app" />
    <meta
      property="og:image"
      content="https://pulse-social-henna.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="%VITE_SOCKET_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        const theme = localStorage.getItem('pulse-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        document.documentElement.removeAttribute('data-theme');
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
