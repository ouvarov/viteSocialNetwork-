name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  VITE_SOCKET_URL: http://localhost:5000

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type-check, lint and format
        run: npm run check
      - name: API types match the API main branch
        run: npm run api:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379
      ORIGIN_SECRET: ci-origin-secret-that-is-long-enough-000
      E2E_API_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v5
        with:
          path: web
      - uses: actions/checkout@v5
        with:
          repository: ouvarov/nestSocialNetwork
          path: api
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Build the API
        working-directory: api
        run: |
          npm ci
          npm run build
          npm run db:migrate:prod
      - name: Start the API
        working-directory: api
        env:
          RATE_LIMIT_DISABLED: true
        run: |
          export JWT_ACCESS_SECRET=$(openssl rand -hex 32)
          export REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)
          nohup node dist/main.js > api.log 2>&1 &
          for attempt in $(seq 30); do
            if curl --silent --fail http://localhost:5000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Install the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e

      - name: API log
        if: failure()
        run: cat api/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
